<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fluent Design 2: rich diagonal gradient, bottom-left → top-right -->
    <linearGradient id="bgGrad" x1="0" y1="1" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="#0C1A6E"/>
      <stop offset="52%"  stop-color="#1665C8"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <!-- Top-right sheen for glass/depth effect -->
    <radialGradient id="sheen" cx="72%" cy="18%" r="52%" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.20)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Bottom-edge darkening vignette -->
    <linearGradient id="vignette" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%"   stop-color="rgba(0,0,0,0)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.18)"/>
    </linearGradient>

    <!-- Outer drop shadow for the squircle -->
    <filter id="iconShadow" x="-12%" y="-12%" width="124%" height="124%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="rgba(0,0,0,0.45)"/>
    </filter>

    <!-- Soft glow behind the circuit tree -->
    <filter id="treeGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Squircle clip for all layers -->
    <clipPath id="squircleClip">
      <rect width="512" height="512" rx="115" ry="115"/>
    </clipPath>
  </defs>

  <!-- ── Squircle layers ── -->
  <g clip-path="url(#squircleClip)">
    <rect width="512" height="512" fill="url(#bgGrad)"/>
    <rect width="512" height="512" fill="url(#sheen)"/>
    <rect width="512" height="512" fill="url(#vignette)"/>
  </g>

  <!-- Squircle border used only for the outer drop shadow (no fill) -->
  <rect width="512" height="512" rx="115" ry="115" fill="none"
        stroke="none" filter="url(#iconShadow)" opacity="0"/>

  <!-- Circuit tree icon: 5 top branches, orthogonal / circuit-board style, symmetric -->
  <g clip-path="url(#squircleClip)" filter="url(#treeGlow)">

    <!-- Lines -->
    <g fill="none" stroke="rgba(255,255,255,0.95)" stroke-width="16"
       stroke-linecap="round" stroke-linejoin="round">
      <!-- Trunk -->
      <line x1="256" y1="420" x2="256" y2="340"/>
      <!-- First horizontal bar (inner 3: x=186,256,326) -->
      <line x1="186" y1="340" x2="326" y2="340"/>
      <!-- Three arms up to second bar -->
      <line x1="186" y1="340" x2="186" y2="265"/>
      <line x1="256" y1="340" x2="256" y2="265"/>
      <line x1="326" y1="340" x2="326" y2="265"/>
      <!-- Second horizontal bar (all 5: x=116…396) -->
      <line x1="116" y1="265" x2="396" y2="265"/>
      <!-- Five terminals up to top -->
      <line x1="116" y1="265" x2="116" y2="135"/>
      <line x1="186" y1="265" x2="186" y2="135"/>
      <line x1="256" y1="265" x2="256" y2="135"/>
      <line x1="326" y1="265" x2="326" y2="135"/>
      <line x1="396" y1="265" x2="396" y2="135"/>
    </g>

    <!-- Dots -->
    <g fill="rgba(255,255,255,0.95)">
      <!-- Base (large) -->
      <circle cx="256" cy="420" r="16"/>
      <!-- First bar junctions (small) -->
      <circle cx="186" cy="340" r="9"/>
      <circle cx="256" cy="340" r="9"/>
      <circle cx="326" cy="340" r="9"/>
      <!-- Second bar junctions (small) -->
      <circle cx="116" cy="265" r="9"/>
      <circle cx="186" cy="265" r="9"/>
      <circle cx="256" cy="265" r="9"/>
      <circle cx="326" cy="265" r="9"/>
      <circle cx="396" cy="265" r="9"/>
      <!-- Top endpoints (large) -->
      <circle cx="116" cy="135" r="16"/>
      <circle cx="186" cy="135" r="16"/>
      <circle cx="256" cy="135" r="16"/>
      <circle cx="326" cy="135" r="16"/>
      <circle cx="396" cy="135" r="16"/>
    </g>
  </g>
</svg>
