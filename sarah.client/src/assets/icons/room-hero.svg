<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="roomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B9D;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C239B3;stop-opacity:1" />
    </linearGradient>
    
    <filter id="roomShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="2" dy="2"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="600" fill="url(#roomGradient)"/>
  
  <!-- Room/door icon (Fluent style) -->
  <g transform="translate(250, 150)">
    <!-- Door frame -->
    <rect x="0" y="0" width="100" height="200" rx="5" fill="white" filter="url(#roomShadow)"/>
    
    <!-- Door panel details -->
    <rect x="10" y="10" width="80" height="85" rx="3" fill="#E1DFDD" opacity="0.5"/>
    <rect x="10" y="105" width="80" height="85" rx="3" fill="#E1DFDD" opacity="0.5"/>
    
    <!-- Door handle -->
    <circle cx="80" cy="100" r="5" fill="#8764B8"/>
    <rect x="75" y="99" width="10" height="2" fill="#8764B8"/>
    
    <!-- Light indicator -->
    <circle cx="50" cy="-20" r="8" fill="#FFD93D" opacity="0.8">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Floor plan lines -->
  <g opacity="0.3" stroke="white" stroke-width="2" fill="none">
    <line x1="100" y1="400" x2="250" y2="400"/>
    <line x1="350" y1="400" x2="500" y2="400"/>
    <line x1="250" y1="350" x2="250" y2="450"/>
    <line x1="350" y1="350" x2="350" y2="450"/>
  </g>
  
  <!-- Decorative elements -->
  <rect x="100" y="100" width="60" height="60" fill="white" opacity="0.15" transform="rotate(45 130 130)"/>
  <circle cx="450" cy="500" r="50" fill="white" opacity="0.2"/>
</svg>
