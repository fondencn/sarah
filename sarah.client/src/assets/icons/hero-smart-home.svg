<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8764B8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B7C3;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#50E6FF;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0078D4;stop-opacity:0.8" />
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#heroGradient)"/>
  
  <!-- Floating geometric shapes (Microsoft Fluent style) -->
  <circle cx="150" cy="100" r="60" fill="#50E6FF" opacity="0.2"/>
  <circle cx="1050" cy="300" r="80" fill="#FFB900" opacity="0.2"/>
  <rect x="900" y="50" width="120" height="120" fill="#8764B8" opacity="0.15" transform="rotate(45 960 110)"/>
  
  <!-- Smart home icon elements -->
  <g transform="translate(800, 150)">
    <!-- House -->
    <path d="M 0 30 L 50 0 L 100 30 L 100 100 L 0 100 Z" fill="white" opacity="0.9" filter="url(#glow)"/>
    <rect x="35" y="60" width="30" height="40" fill="#0078D4" opacity="0.8"/>
    <circle cx="45" cy="80" r="2" fill="white"/>
    
    <!-- Window -->
    <rect x="10" y="45" width="20" height="20" fill="#50E6FF" opacity="0.6"/>
    <rect x="70" y="45" width="20" height="20" fill="#50E6FF" opacity="0.6"/>
    
    <!-- Connected dots/nodes -->
    <circle cx="50" cy="15" r="4" fill="#FFB900" filter="url(#glow)"/>
    <circle cx="20" cy="50" r="3" fill="#50E6FF" filter="url(#glow)"/>
    <circle cx="80" cy="50" r="3" fill="#50E6FF" filter="url(#glow)"/>
    
    <!-- Connection lines -->
    <line x1="50" y1="15" x2="20" y2="50" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="50" y1="15" x2="80" y2="50" stroke="white" stroke-width="2" opacity="0.5"/>
  </g>
  
  <!-- Abstract flowing shapes -->
  <path d="M 0 250 Q 150 200, 300 250 T 600 250" stroke="#50E6FF" stroke-width="3" fill="none" opacity="0.3"/>
  <path d="M 600 150 Q 750 180, 900 150 T 1200 150" stroke="#FFB900" stroke-width="3" fill="none" opacity="0.3"/>
  
  <!-- Modern dots pattern -->
  <g opacity="0.3">
    <circle cx="100" cy="300" r="2" fill="white"/>
    <circle cx="120" cy="310" r="2" fill="white"/>
    <circle cx="140" cy="295" r="2" fill="white"/>
    <circle cx="160" cy="305" r="2" fill="white"/>
  </g>
</svg>
