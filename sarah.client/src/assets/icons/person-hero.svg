<svg width="600" height="600" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="personGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#50E6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0078D4;stop-opacity:1" />
    </linearGradient>
    
    <filter id="softShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="3" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="600" fill="url(#personGradient)"/>
  
  <!-- Person icon (Fluent style) -->
  <g transform="translate(300, 250)">
    <!-- Head -->
    <circle cx="0" cy="-40" r="45" fill="white" filter="url(#softShadow)"/>
    
    <!-- Body -->
    <path d="M -60 60 Q -60 0, 0 0 Q 60 0, 60 60 L 60 120 Q 60 135, 45 135 L -45 135 Q -60 135, -60 120 Z" 
          fill="white" filter="url(#softShadow)"/>
    
    <!-- Location indicator -->
    <g transform="translate(70, -70)">
      <path d="M 0 0 Q -10 -15, 0 -30 Q 10 -15, 0 0" fill="#FFB900" opacity="0.9"/>
      <circle cx="0" cy="-20" r="4" fill="white"/>
    </g>
  </g>
  
  <!-- Connected network visualization -->
  <g opacity="0.4">
    <line x1="200" y1="150" x2="300" y2="210" stroke="white" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="400" y1="150" x2="300" y2="210" stroke="white" stroke-width="2" stroke-dasharray="5,5"/>
    <circle cx="200" cy="150" r="8" fill="white"/>
    <circle cx="400" cy="150" r="8" fill="white"/>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="120" cy="480" r="50" fill="white" opacity="0.15"/>
  <circle cx="480" cy="120" r="40" fill="white" opacity="0.2"/>
</svg>
