<div class="container mt-4">
  <h2 class="mb-4">⚙️ {{ 'admin.title' | translate }}</h2>

  <ul class="nav nav-tabs admin-tabs mb-3" role="tablist">
    <li class="nav-item" role="presentation">
      <button
        type="button"
        class="nav-link"
        [class.active]="activeTab === 'ruleMonitor'"
        (click)="setActiveTab('ruleMonitor')">
        {{ 'admin.tabs.ruleMonitor' | translate }}
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button
        type="button"
        class="nav-link"
        [class.active]="activeTab === 'kernelConversation'"
        (click)="setActiveTab('kernelConversation')">
        {{ 'admin.tabs.kernelConversation' | translate }}
      </button>
    </li>
    <li class="nav-item" role="presentation">
      <button
        type="button"
        class="nav-link"
        [class.active]="activeTab === 'promptRules'"
        (click)="setActiveTab('promptRules')">
        {{ 'admin.tabs.promptRules' | translate }}
      </button>
    </li>
  </ul>

  <div class="admin-tab-panel">
    <app-rule-monitor *ngIf="activeTab === 'ruleMonitor'"></app-rule-monitor>
    <app-kernel-conversation-panel *ngIf="activeTab === 'kernelConversation'"></app-kernel-conversation-panel>
    <app-prompt-rules-manager *ngIf="activeTab === 'promptRules'"></app-prompt-rules-manager>
  </div>
</div>
