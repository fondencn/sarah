<nav class="navbar navbar-light bg-light">
  <button class="navbar-toggler" type="button" (click)="toggleNavbar()">
    <span class="navbar-toggler-icon"></span>
  </button>
  <a class="navbar-brand" [routerLink]="['/home']">Sarah UI</a>
  <div class="sidebar" [class.active]="navbarOpen">
    <ul class="navbar-nav">
      <li class="nav-item active">
        <a class="nav-link" [routerLink]="['/home']">{{ 'nav.home' | translate }}</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" [routerLink]="['/devices']">{{ 'nav.devices' | translate }}</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" [routerLink]="['/persons']">{{ 'nav.persons' | translate }}</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" [routerLink]="['/rooms']">{{ 'nav.rooms' | translate }}</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" [routerLink]="['/alarms']">{{ 'nav.alarms' | translate }}</a>
      </li>
      <li class="nav-item">
        <a class="nav-link" [routerLink]="['/admin']">{{ 'nav.admin' | translate }}</a>
      </li>
    </ul>
  </div>
  <div class="lang-switcher">
    <button
      class="btn btn-sm lang-btn"
      [class.lang-active]="(languageService.currentLang$ | async) === 'de'"
      (click)="setLang('de')"
    >DE</button>
    <button
      class="btn btn-sm lang-btn"
      [class.lang-active]="(languageService.currentLang$ | async) === 'en'"
      (click)="setLang('en')"
    >EN</button>
  </div>
</nav>
