<div class="devices-container container mt-4">
  <h2 class="mb-4">Devices List</h2>
  <table *ngIf="devices.length > 0; else noDevices" class="table table-striped table-bordered table-hover">
    <thead class="thead-dark">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Info</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let device of devices">
        <td>{{ device.id }}</td>
        <td>{{ device.name }}</td>
        <td>{{ device.typeName }}</td>
        <td>{{ device.info }}</td>
      </tr>
    </tbody>
  </table>
  <ng-template #noDevices>
    <p class="text-muted">No devices found.</p>
  </ng-template>
</div>
