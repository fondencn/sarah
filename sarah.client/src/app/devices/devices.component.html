<div class="devices-container container mt-4">
  <h2 class="mb-4">Devices List</h2>
  <button (click)="retrieveDevices()" class="btn btn-primary m-4">
    <img src="assets/icons/refresh.svg" alt="Refresh" style="width: 20px; height: 20px; vertical-align: middle; margin-right: 5px;">
    Refresh
  </button>
  <button (click)="addDevice()" class="btn btn-secondary m-4">
    <img src="assets/icons/add.svg" alt="Add" style="width: 20px; height: 20px; vertical-align: middle; margin-right: 5px;">
    Add
  </button>

  <!-- Busy Indicator -->
  <div *ngIf="isLoading" class="d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="spinner-border text-primary" role="status">
    </div>
    <span class="sr-only">Loading...</span>
  </div>

  <!-- Devices Table -->
  <table *ngIf="!isLoading && devices.length > 0; else noDevices" class="table table-striped table-bordered table-hover">
    <thead class="thead-dark">
      <tr>
        <th>ID</th>
        <th>Node ID</th>
        <th>Name</th>
        <th>Type</th>
        <th>Info</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let device of devices">
        <td>{{ device.id }}</td> 
        <td>{{ device.nodeId }}</td>
        <td>{{ device.name }}</td>
        <td>{{ device.typeName }}</td>
        <td [innerHTML]="device.info"></td>
        <td>
          <button (click)="editDevice(device)" class="btn btn-secondary btn-sm">
            <img src="assets/icons/edit.svg" alt="Edit" style="width: 16px; height: 16px;">
          </button>
          <button (click)="deleteDevice(device)" class="btn btn-danger btn-sm">
            <img src="assets/icons/delete.svg" alt="Delete" style="width: 16px; height: 16px;">
          </button>
          <button *ngIf="device.isFavourite != true" (click)="setFavourite(device, true)" class="btn btn-secondary  btn-sm">
            <img src="assets/icons/star.svg" alt="Favorite" style="width: 16px; height: 16px;">
          </button>
          <button *ngIf="device.isFavourite === true" (click)="setFavourite(device, false)" class="btn btn-secondary  btn-sm">
            <img src="assets/icons/unfavorite.svg" alt="Unfavorite" style="width: 16px; height: 16px;">
          </button>
        </td>
      </tr>
    </tbody>
  </table>
  <ng-template #noDevices>
    <p class="text-muted">No devices loaded.</p>
  </ng-template>
</div>
