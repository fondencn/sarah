<div class="modal fade" id="addDeviceModal" tabindex="-1" role="dialog" aria-labelledby="addDeviceModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addDeviceModalLabel">Add a new device</h5>
      </div>
      <div class="modal-body">
        <form [formGroup]="deviceForm">
          <div class="form-group">
            <label for="name">Name: </label>
            <input type="text" id="name" class="form-control" formControlName="name">
          </div>
            <div class="form-group"></div>
            <label for="nodeId">Associated device: </label>
            <select id="nodeId" class="form-control" formControlName="nodeId">
              <option *ngFor="let networkElement of allNetworkElements" [value]="networkElement.id">
              {{ networkElement.id }} - {{ networkElement.type }}
              </option>
            </select>
            <div class="form-group">
            <label for="typeName">Geräteklasse: </label>
            <select id="typeName" class="form-control" formControlName="typeName">
              <option *ngFor="let deviceType of allDeviceTypes" [value]="deviceType.enumKey">
              {{ deviceType.enumValue }}
              </option>
            </select>
            </div>
            <div class="form-group">
            <label for="roomId">Zugeordneter Raum</label>
            <select id="roomId" class="form-control" formControlName="roomId">
              <option *ngFor="let room of allRooms" [value]="room.id">
              {{ room.name }}
              </option>
            </select>
            </div>
          <div class="form-group">
            <div class="form-check">
              <input type="checkbox" id="isReadonly" class="form-check-input" formControlName="isReadonly">
              <label class="form-check-label" for="isReadonly">Schreibgeschützt</label>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel()" data-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="onOk()" [disabled]="deviceForm.invalid">Add</button>
      </div>
    </div>
  </div>
</div>
