<div class="modal fade" id="addDeviceModal" tabindex="-1" role="dialog" aria-labelledby="addDeviceModalLabel" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addDeviceModalLabel">Add a new device</h5>
      </div>
      <div class="modal-body">
        <form [formGroup]="deviceForm">
          <div class="form-group">
            <label for="nodeId">Node ID</label>
            <input type="text" id="nodeId" class="form-control" formControlName="id">
          </div>
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" class="form-control" formControlName="name">
          </div>
          <div class="form-group">
            <label for="typeName">Type</label>
            <input type="text" id="typeName" class="form-control" formControlName="typeName">
          </div>
          <div class="form-group">
            <label for="info">Info</label>
            <textarea id="info" class="form-control" formControlName="info"></textarea>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel()" data-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="onOk()" [disabled]="deviceForm.invalid">Add</button>
      </div>
    </div>
  </div>
</div>
