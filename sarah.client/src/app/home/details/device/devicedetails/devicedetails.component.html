<div class="container mt-4">
  <div *ngIf="deviceDetails; else loading">
    <div class="card">
      <div class="card-header">
        <h3>{{ deviceDetails.name }}</h3>
      </div>
      <div class="card-body">
        <h5 class="card-title">Device Details</h5>
        <p class="card-text"><strong>ID:</strong> {{ deviceDetails.id }}</p>
        <p class="card-text"><strong>Type:</strong> {{ deviceDetails.deviceType }}</p>
        <p class="card-text"><strong>Info:</strong> {{ deviceDetails.info }}</p>
        <!-- Add more device-specific details here -->
      </div>
      <div class="card-footer text-muted">
        Last updated: january 1, 2021
      </div>
    </div>
  </div>
  <ng-template #loading>
    <div class="text-center">
      <div class="spinner-border" role="status">
        <span class="sr-only">Loading...</span>
      </div>
      <p>Loading device details...</p>
    </div>
  </ng-template>
</div>
