<div class="container-fluid vh-100 d-flex align-items-center justify-content-center">
  <div class="row">
    <div class="col-md-12 text-center">
      <div class="d-flex flex-row flex-wrap justify-content-center">
        <div class="card shadow-lg p-3 m-2 flex-grow-1" style="background: rgba(255, 255, 255, 0.8); border-radius: 15px; min-width: 300px;">
          <div class="card-body">
            <h1 class="display-4 text-primary">Welcome</h1>
            <p class="lead">You are logged in.</p>
            <ng-container *ngIf="this.isLoggedIn(); else loginTemplate">
              <h2 class="mt-4">Welcome, {{ currentUserDisplayName }}</h2>
              <button class="btn btn-primary mt-4" (click)="logout()">Logout</button>
            </ng-container>
            <ng-template #loginTemplate>
              <button class="btn btn-primary mt-4" (click)="login()">User Login</button>
            </ng-template>
          </div>
        </div>

        <ng-container *ngIf="this.isLoggedIn()">
          <div class="card shadow-lg p-3 m-2 flex-grow-1" style="background: rgba(255, 255, 255, 0.8); border-radius: 15px; min-width: 300px;">
            <div class="card-body">
              <h1 class="display-4 text-primary">System Status</h1>
              <span class="lead">{{ statusMessage }}</span><br/>
              <span class="lead">Hostname: {{ statusDto?.hostname }}</span><br/>
              <span class="lead">Port: {{ statusDto?.port }}</span><br/>
              <span class="lead">Authenticated: {{ statusDto?.isAuthenticated }}</span><br/>
              <span class="lead">Username (Server): {{ statusDto?.username }}</span>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</div>
