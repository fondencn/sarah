<div class="alarms-container container-fluid mt-4">
  <h2 class="mb-4">⏰ {{ 'alarms.title' | translate }}</h2>

  <div class="calendar-shell position-relative">
    <!-- Calendar -->
    <full-calendar [options]="calendarOptions"></full-calendar>

    <!-- Loading overlay -->
    <div *ngIf="isLoading" class="calendar-loading-overlay d-flex justify-content-center align-items-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">{{ 'alarms.loading' | translate }}</span>
      </div>
      <span class="ms-3">{{ 'alarms.loading' | translate }}</span>
    </div>
  </div>

  <!-- Hint text -->
  <p class="text-muted mt-2 small">
    <em>{{ 'alarms.hint' | translate }}</em>
  </p>

  <!-- Edit / Create Modal -->
  <alarm-edit-modal (alarmSaved)="onAlarmSaved()"></alarm-edit-modal>
</div>
