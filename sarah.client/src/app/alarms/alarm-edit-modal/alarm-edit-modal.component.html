<!-- Modal backdrop -->
<div class="modal-backdrop fade show" *ngIf="isVisible" (click)="close()"></div>

<!-- Modal dialog -->
<div
  class="modal fade show"
  [style.display]="isVisible ? 'block' : 'none'"
  tabindex="-1"
  role="dialog"
  aria-labelledby="alarmEditModalLabel"
  aria-modal="true"
>
  <div class="modal-dialog modal-lg" role="document">
    <div class="modal-content">

      <!-- Header -->
      <div class="modal-header">
        <h5 class="modal-title" id="alarmEditModalLabel">
          {{ (isEditing ? 'alarms.editTitle' : 'alarms.newTitle') | translate }}
        </h5>
        <button type="button" class="btn-close" (click)="close()" aria-label="Close"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <form [formGroup]="form" novalidate>

          <!-- Alarm type -->
          <div class="mb-3">
            <label for="contentType" class="form-label fw-semibold">Alarmtyp <span class="text-danger">*</span></label>
            <select
              id="contentType"
              class="form-select"
              formControlName="contentType"
              (change)="onContentTypeChanged()"
            >
              <option *ngFor="let type of contentTypeOptions" [value]="type.value">{{ type.label }}</option>
            </select>
          </div>

          <!-- Title / Text -->
          <div class="mb-3">
            <label for="alarmText" class="form-label fw-semibold">
              {{ isTemperatureContent ? 'Bezeichnung' : ('alarms.labelText' | translate) }}
              <span *ngIf="!isTemperatureContent" class="text-danger">*</span>
            </label>
            <input
              type="text"
              id="alarmText"
              class="form-control"
              formControlName="text"
              [placeholder]="isTemperatureContent ? 'Temperaturplan' : ('alarms.placeholderText' | translate)"
              [class.is-invalid]="form.get('text')?.invalid && form.get('text')?.touched"
            >
            <div class="invalid-feedback">{{ 'alarms.textRequired' | translate }}</div>
          </div>

          <!-- Date & Time -->
          <div class="mb-3">
            <label for="alarmTime" class="form-label fw-semibold">{{ 'alarms.labelDateTime' | translate }} <span class="text-danger">*</span></label>
            <input
              type="datetime-local"
              id="alarmTime"
              class="form-control"
              formControlName="alarmTime"
              [class.is-invalid]="form.get('alarmTime')?.invalid && form.get('alarmTime')?.touched"
            >
            <div class="invalid-feedback">{{ 'alarms.dateTimeRequired' | translate }}</div>
          </div>

          <div class="row">
            <!-- Volume -->
            <div class="col-md-6 mb-3" *ngIf="!isTemperatureContent">
              <label for="alarmVolume" class="form-label fw-semibold">{{ 'alarms.labelVolume' | translate }}</label>
              <select id="alarmVolume" class="form-select" formControlName="volume">
                <option *ngFor="let v of volumeOptions" [value]="v.value">{{ v.label }}</option>
              </select>
            </div>

            <!-- Target Speaker -->
            <div class="col-md-6 mb-3" *ngIf="!isTemperatureContent">
              <label for="targetSpeaker" class="form-label fw-semibold">{{ 'alarms.labelTargetSpeaker' | translate }}</label>
              <input
                type="text"
                id="targetSpeaker"
                class="form-control"
                formControlName="targetSpeaker"
                [placeholder]="'alarms.placeholderSpeaker' | translate"
              >
            </div>
          </div>

          <!-- Temperature settings -->
          <div *ngIf="isTemperatureContent" class="card border-success bg-light p-3 mb-3" formGroupName="temperature">
            <h6 class="card-title mb-3">Temperaturplan</h6>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="temperatureRoomId" class="form-label fw-semibold">Raum <span class="text-danger">*</span></label>
                <select id="temperatureRoomId" class="form-select" formControlName="roomId">
                  <option value="">Bitte Raum auswählen</option>
                  <option *ngFor="let room of allRooms" [value]="room.id">{{ room.name }}</option>
                </select>
              </div>

              <div class="col-md-6 mb-3">
                <label for="temperatureTarget" class="form-label fw-semibold">Zieltemperatur °C <span class="text-danger">*</span></label>
                <input
                  type="number"
                  id="temperatureTarget"
                  class="form-control"
                  formControlName="targetTemperature"
                  min="5"
                  max="30"
                  step="0.5"
                >
              </div>
            </div>
          </div>

          <!-- Active toggle -->
          <div class="mb-3 form-check form-switch">
            <input
              type="checkbox"
              id="isActive"
              class="form-check-input"
              formControlName="isActive"
              role="switch"
            >
            <label class="form-check-label fw-semibold" for="isActive">{{ 'alarms.labelActive' | translate }}</label>
          </div>

          <!-- Holiday restrictions -->
          <div class="mb-3">
            <label class="form-label fw-semibold">{{ 'alarms.labelHolidayRestriction' | translate }}</label>
            <div class="form-check form-switch mb-1">
              <input
                type="checkbox"
                id="isNurInFerien"
                class="form-check-input"
                formControlName="isNurInFerien"
                role="switch"
              >
              <label class="form-check-label" for="isNurInFerien">{{ 'alarms.onlyDuringHolidays' | translate }}</label>
            </div>
            <div class="form-check form-switch">
              <input
                type="checkbox"
                id="isNichtInFerien"
                class="form-check-input"
                formControlName="isNichtInFerien"
                role="switch"
              >
              <label class="form-check-label" for="isNichtInFerien">{{ 'alarms.notDuringHolidays' | translate }}</label>
            </div>
          </div>

          <!-- Recurrence toggle -->
          <div class="mb-3 form-check form-switch">
            <input
              type="checkbox"
              id="hasRecurrence"
              class="form-check-input"
              formControlName="hasRecurrence"
              role="switch"
            >
            <label class="form-check-label fw-semibold" for="hasRecurrence">{{ 'alarms.recurringEvent' | translate }}</label>
          </div>

          <!-- Recurrence settings -->
          <div *ngIf="hasRecurrence" class="card p-3 mb-3 bg-light border-primary" formGroupName="recurrence">
            <h6 class="card-title mb-3">{{ 'alarms.recurrenceSettings' | translate }}</h6>

            <!-- Frequency -->
            <div class="mb-3">
              <label for="recurrenceFreq" class="form-label">{{ 'alarms.repeat' | translate }}</label>
              <select id="recurrenceFreq" class="form-select" formControlName="freq">
                <option *ngFor="let f of frequencyOptions" [value]="f.value">{{ f.label }}</option>
              </select>
            </div>

            <!-- Interval -->
            <div class="mb-3">
              <label for="recurrenceInterval" class="form-label">{{ 'alarms.every' | translate }}</label>
              <div class="input-group" style="max-width: 200px;">
                <input
                  type="number"
                  id="recurrenceInterval"
                  class="form-control"
                  formControlName="interval"
                  min="1"
                >
                <span class="input-group-text">{{ freqLabel(selectedFreq) }}</span>
              </div>
            </div>

            <!-- Days of week (only for weekly) -->
            <div class="mb-3" *ngIf="selectedFreq === 'weekly'">
              <label class="form-label">{{ 'alarms.daysOfWeek' | translate }}</label>
              <div class="d-flex flex-wrap gap-2">
                <button
                  type="button"
                  *ngFor="let day of weekdays"
                  class="btn btn-sm"
                  [class.btn-primary]="isWeekdaySelected(day.key)"
                  [class.btn-outline-secondary]="!isWeekdaySelected(day.key)"
                  (click)="toggleWeekday(day.key)"
                >
                  {{ day.label }}
                </button>
              </div>
            </div>

            <!-- End date -->
            <div class="mb-2">
              <label for="recurrenceUntil" class="form-label">{{ 'alarms.endDate' | translate }} <span class="text-muted">{{ 'alarms.endDateOptional' | translate }}</span></label>
              <input
                type="date"
                id="recurrenceUntil"
                class="form-control"
                formControlName="until"
                style="max-width: 200px;"
              >
            </div>
          </div>

        </form>
      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button
          *ngIf="isEditing"
          type="button"
          class="btn btn-danger me-auto"
          (click)="delete()"
          [disabled]="isSaving"
        >
          <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          {{ 'alarms.delete' | translate }}
        </button>
        <button type="button" class="btn btn-secondary" (click)="close()" [disabled]="isSaving">
          {{ 'alarms.cancel' | translate }}
        </button>
        <button
          type="button"
          class="btn btn-primary"
          (click)="save()"
          [disabled]="form.invalid || isSaving"
        >
          <span *ngIf="isSaving" class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
          {{ (isSaving ? 'alarms.saving' : 'alarms.save') | translate }}
        </button>
      </div>

    </div>
  </div>
</div>
