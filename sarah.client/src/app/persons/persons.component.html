<div class="container mt-4">

    <h2 class="mb-4">Persons List</h2>
    <button (click)="retrievePersons()" class="btn btn-primary m-4">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle; margin-right: 5px;">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
        Refresh
    </button>
    <button (click)="addPerson()" class="btn btn-secondary m-4">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="vertical-align: middle; margin-right: 5px;">
          <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
        </svg>
        Add
    </button>

    <!-- Busy Indicator -->
    <div *ngIf="isLoading" class="d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div class="spinner-border text-primary" role="status">
        </div>
        <span class="sr-only">Loading...</span>
    </div>

    <table *ngIf="!isLoading && persons.length > 0; else noRooms"
        class="table table-striped table-bordered table-hover">
        <thead class="thead-dark">
            <tr>
                <th>Id</th>
                <th>name</th>
                <th>GpsTracker</th>
                <th>Geofence</th>
                <th>Position</th>
                <th>Phone name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let person of persons">
                <td>{{ person.id }}</td>
                <td>{{ person.name }}</td>
                <td>{{ person.gpsTrackerName }}</td>
                <td>{{ person.currentGeoFence }}</td>
                <td>{{ person.currentPosition }}</td>
                <td>{{ person.mobilePhoneHostname }}</td>
                <td>
                    <button (click)="editPerson(person)" class="btn btn-secondary btn-sm">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                          <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
                        </svg>
                    </button>
                    <button (click)="deletePerson(person)" class="btn btn-danger btn-sm">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                          <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                        </svg>
                    </button>
                    <button *ngIf="person.isFavourite != true" (click)="setFavourite(person, true)"
                        class="btn btn-secondary  btn-sm">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                          <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
                        </svg>
                    </button>
                    <button *ngIf="person.isFavourite === true" (click)="setFavourite(person, false)"
                        class="btn btn-secondary  btn-sm">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                          <path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/>
                        </svg>
                    </button>
                </td>
            </tr>
        </tbody>
    </table>

    <ng-template #noRooms>
        <p class="text-muted">No persons loaded.</p>
    </ng-template>
</div>

<editPersonModal></editPersonModal>
