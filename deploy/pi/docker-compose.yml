services:
  # ─── Observability (OTel stack) ────────────────────────────────────
  # Start with:  docker compose --profile observability up -d
  # All Sarah microservices export OTLP to otel-collector when this
  # profile is active.  Grafana is available at http://pi:3000.

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:0.103.0
    command: ["--config=/etc/otel/config.yml"]
    volumes:
      - ./otel/otel-collector-config.yml:/etc/otel/config.yml:ro
    ports:
      - "4317:4317"   # OTLP gRPC  (microservices → collector)
      - "4318:4318"   # OTLP HTTP  (microservices → collector)
    networks:
      - sarah-network
    restart: unless-stopped

  victoriametrics:
    profiles: [observability]
    # VictoriaMetrics single-node: ~40-60 MB RAM vs ~100-150 MB for Prometheus,
    # 10x better disk compression, identical PromQL API — well-suited for Pi.
    image: victoriametrics/victoria-metrics:v1.101.0
    command:
      - "--promscrape.config=/etc/vm/scrape.yml"
      - "--retentionPeriod=7d"
      - "--storageDataPath=/victoria-metrics-data"
    volumes:
      - ./otel/victoria-metrics-scrape.yml:/etc/vm/scrape.yml:ro
      - victoriametrics-data:/victoria-metrics-data
    ports:
      - "8428:8428"
    depends_on:
      - otel-collector
    networks:
      - sarah-network
    restart: unless-stopped

  loki:
    profiles: [observability]
    image: grafana/loki:3.1.0
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./otel/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - sarah-network
    restart: unless-stopped

  tempo:
    profiles: [observability]
    image: grafana/tempo:2.5.0
    command: -config.file=/etc/tempo/config.yml
    volumes:
      - ./otel/tempo-config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - sarah-network
    restart: unless-stopped

  grafana:
    profiles: [observability]
    image: grafana/grafana:11.0.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-CHANGE_ME_grafana}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./otel/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - victoriametrics
      - loki
      - tempo
    networks:
      - sarah-network
    restart: unless-stopped

  # ─── Infrastructure ────────────────────────────────────────────────

  keycloak:
    image: quay.io/keycloak/keycloak:latest
    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN:-admin}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_HOSTNAME=${PI_HOST:-pi}
      - KC_HOSTNAME_STRICT=false
      - KC_HTTP_ENABLED=true
      - KC_HTTP_PORT=8080
      - KC_PROXY_HEADERS=xforwarded
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./sarah-realm-realm.json:/opt/keycloak/data/import/sarah-realm-realm.json:ro
    command: start-dev --features=preview --spi-connections-http-client-default-disable-trust-manager=true --import-realm
    networks:
      - sarah-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - sarah-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    networks:
      - sarah-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s

  # ─── Microservices ─────────────────────────────────────────────────

  deviceservice:
    image: ${REGISTRY:-sarah}/deviceservice:${TAG:-latest}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=deviceservice
      - ConnectionStrings__PostgresConnection=Host=postgres;Database=devicesdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - OIDCAuthority=http://${PI_HOST:-pi}:8080/realms/sarah-realm
      - ConnectionStrings__rabbitmq=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - AllowedOrigins__0=http://${PI_HOST:-pi}
      - AllowedOrigins__1=http://${PI_HOST:-pi}:4200
      - AllowedOrigins__2=http://${PI_HOST:-pi}:8081
      - ZWave__SerialPortName=${ZWAVE_SERIAL_PORT:-/dev/ttyACM0}
      - TheThingsNetwork__ApiKey=${TTN_API_KEY:-}
    ports:
      - "5001:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - sarah-network
    restart: unless-stopped
    devices:
      - "${ZWAVE_SERIAL_PORT:-/dev/ttyACM0}:${ZWAVE_SERIAL_PORT:-/dev/ttyACM0}"

  personsservice:
    image: ${REGISTRY:-sarah}/personsservice:${TAG:-latest}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=personsservice
      - ConnectionStrings__PostgresConnection=Host=postgres;Database=personsdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - OIDCAuthority=http://${PI_HOST:-pi}:8080/realms/sarah-realm
      - ConnectionStrings__rabbitmq=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - DeviceServiceUrl=http://deviceservice:8080
      - FritzBox__Username=${FRITZBOX_USERNAME:-}
      - FritzBox__Password=${FRITZBOX_PASSWORD:-}
      - FritzBox__Host=${FRITZBOX_HOST:-192.168.178.1}
      - services__deviceservice__http__0=http://deviceservice:8080
      - services__deviceservice__http-api__0=http://deviceservice:8080
      - services__geofencesservice__http-api__0=http://geofencesservice:8080
      - GeoFenceServiceUrl=http://geofencesservice:8080
      - AllowedOrigins__0=http://${PI_HOST:-pi}
      - AllowedOrigins__1=http://${PI_HOST:-pi}:4200
      - AllowedOrigins__2=http://${PI_HOST:-pi}:8081
    extra_hosts:
      - "fritz.box:${FRITZBOX_HOST_IP:-192.168.178.1}"
    ports:
      - "5002:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - sarah-network
    restart: unless-stopped

  geofencesservice:
    image: ${REGISTRY:-sarah}/geofencesservice:${TAG:-latest}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=geofencesservice
      - OIDCAuthority=http://${PI_HOST:-pi}:8080/realms/sarah-realm
      - ConnectionStrings__rabbitmq=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - AllowedOrigins__0=http://${PI_HOST:-pi}
      - AllowedOrigins__1=http://${PI_HOST:-pi}:4200
      - AllowedOrigins__2=http://${PI_HOST:-pi}:8081
    ports:
      - "5003:8080"
    depends_on:
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - sarah-network
    restart: unless-stopped

  roomservice:
    image: ${REGISTRY:-sarah}/roomservice:${TAG:-latest}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=roomservice
      - ConnectionStrings__PostgresConnection=Host=postgres;Database=roomsdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - OIDCAuthority=http://${PI_HOST:-pi}:8080/realms/sarah-realm
      - AllowedOrigins__0=http://${PI_HOST:-pi}
      - AllowedOrigins__1=http://${PI_HOST:-pi}:4200
      - AllowedOrigins__2=http://${PI_HOST:-pi}:8081
    ports:
      - "5004:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - sarah-network
    restart: unless-stopped

  monitoringservice:
    image: ${REGISTRY:-sarah}/monitoringservice:${TAG:-latest}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=monitoringservice
      - OIDCAuthority=http://${PI_HOST:-pi}:8080/realms/sarah-realm
      - ConnectionStrings__rabbitmq=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - OpenWeatherMap__ApiKey=${OPENWEATHER_API_KEY:-}
      - WeatherWarnLocation=Ludwigsburg
      - services__deviceservice__http-api__0=http://deviceservice:8080
      - DeviceServiceUrl=http://deviceservice:8080
      - services__personsservice__http-api__0=http://personsservice:8080
      - PersonServiceUrl=http://personsservice:8080
      - services__roomservice__http-api__0=http://roomservice:8080
      - RoomServiceUrl=http://roomservice:8080
      - Keycloak__ServiceClientSecret=${MONITORING_CLIENT_SECRET}
      - AllowedOrigins__0=http://${PI_HOST:-pi}
      - AllowedOrigins__1=http://${PI_HOST:-pi}:4200
      - AllowedOrigins__2=http://${PI_HOST:-pi}:8081
    ports:
      - "5005:8080"
    depends_on:
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - sarah-network
    restart: unless-stopped

  rulesservice:
    image: ${REGISTRY:-sarah}/rulesservice:${TAG:-latest}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=rulesservice
      - ConnectionStrings__PostgresConnection=Host=postgres;Database=rulesdb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - OIDCAuthority=http://${PI_HOST:-pi}:8080/realms/sarah-realm
      - ConnectionStrings__rabbitmq=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - services__deviceservice__http-api__0=http://deviceservice:8080
      - services__personsservice__http-api__0=http://personsservice:8080
      - DeviceServiceUrl=http://deviceservice:8080
      - PersonServiceUrl=http://personsservice:8080
      - AllowedOrigins__0=http://${PI_HOST:-pi}
      - AllowedOrigins__1=http://${PI_HOST:-pi}:4200
      - AllowedOrigins__2=http://${PI_HOST:-pi}:8081
      - EmailNotifier__SmtpSender=${SMTP_SENDER:-}
      - EmailNotifier__SmtpServer=${SMTP_SERVER:-}
      - EmailNotifier__SmtpPort=${SMTP_PORT:-25}
      - EmailNotifier__SmtpUsername=${SMTP_USERNAME:-}
      - EmailNotifier__SmtpPassword=${SMTP_PASSWORD:-}
      - Keycloak__ServiceClientSecret=${RULES_CLIENT_SECRET}
    ports:
      - "5006:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - sarah-network
    restart: unless-stopped

  dashboardservice:
    image: ${REGISTRY:-sarah}/dashboardservice:${TAG:-latest}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=dashboardservice
      - ConnectionStrings__PostgresConnection=Host=postgres;Database=dashboarddb;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - OIDCAuthority=http://${PI_HOST:-pi}:8080/realms/sarah-realm
      - services__deviceservice__http__0=http://deviceservice:8080
      - services__deviceservice__http-api__0=http://deviceservice:8080
      - services__personsservice__http__0=http://personsservice:8080
      - services__personsservice__http-api__0=http://personsservice:8080
      - AllowedOrigins__0=http://${PI_HOST:-pi}
      - AllowedOrigins__1=http://${PI_HOST:-pi}:4200
      - AllowedOrigins__2=http://${PI_HOST:-pi}:8081
    ports:
      - "5007:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - sarah-network
    restart: unless-stopped

  adminservice:
    image: ${REGISTRY:-sarah}/adminservice:${TAG:-latest}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - OTEL_SERVICE_NAME=adminservice
      - OIDCAuthority=http://${PI_HOST:-pi}:8080/realms/sarah-realm
      - ConnectionStrings__rabbitmq=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      - AllowedOrigins__0=http://${PI_HOST:-pi}
      - AllowedOrigins__1=http://${PI_HOST:-pi}:4200
      - AllowedOrigins__2=http://${PI_HOST:-pi}:8081
    ports:
      - "5009:8080"
    depends_on:
      keycloak:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    networks:
      - sarah-network
    restart: unless-stopped

  # ─── Frontend ──────────────────────────────────────────────────────

  frontend:
    image: ${REGISTRY:-sarah}/frontend:${TAG:-latest}
    ports:
      - "8081:80"
    depends_on:
      - deviceservice
    networks:
      - sarah-network
    restart: unless-stopped

networks:
  sarah-network:
    driver: bridge

volumes:
  keycloak-data:
  rabbitmq-data:
  postgres-data:
  victoriametrics-data:
  loki-data:
  tempo-data:
  grafana-data:
