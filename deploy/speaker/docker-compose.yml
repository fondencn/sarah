services:
  speechserver:
    image: ${REGISTRY:-sarah}/speechserver:${TAG:-latest}
    # SpeechServer routes targeted messages using its machine name. Keep that
    # name stable instead of letting Docker use the generated container ID.
    hostname: ${SPEAKER_HOSTNAME:-speaker1}
    environment:
      - TZ=${TZ:-Europe/Berlin}
      - ASPNETCORE_ENVIRONMENT=Production
      - OIDCAuthority=http://${PI_HOST:-pi}:8080/realms/sarah-realm
      - ConnectionStrings__rabbitmq=amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD}@${PI_HOST:-pi}:5672
      - services__deviceservice__http-api__0=http://${PI_HOST:-pi}:5001
      - AzureSpeech__SubscriptionKey=${AZURE_SPEECH_KEY}
      - AzureSpeech__Region=${AZURE_SPEECH_REGION:-westeurope}
      - AzureSpeech__VoiceName=${AZURE_SPEECH_VOICE_NAME:-de-DE-KatjaNeural}
      - Speech__SubscriptionKey=${AZURE_SPEECH_KEY}
      - Speech__Region=${AZURE_SPEECH_REGION:-westeurope}
      - Location=${SPEAKER_LOCATION:-Wohnzimmer}
      - Speech__RecognitionEnabled=${SPEECH_RECOGNITION_ENABLED:-true}
      - Logging__LogLevel__Sarah__Voice__Synthesis__AzureSpeechSynthesizer=${SPEECH_SYNTHESIS_LOG_LEVEL:-Information}
      - Logging__LogLevel__Sarah.Voice.Synthesis.AzureSpeechSynthesizer=${SPEECH_SYNTHESIS_LOG_LEVEL:-Information}
    ports:
      - "5008:8080"
    restart: unless-stopped
    # ── Hardware access ──────────────────────────────────────────────
    # GPIO (LED ring power control via ReSpeakerLEDService)
    # SPI  (APA102 LED ring on SPI bus 0 CS0)
    # Sound (aplay playback + Azure Speech SDK microphone input)
    devices:
      - /dev/gpiomem:/dev/gpiomem     # Raspberry Pi memory-mapped GPIO (required by System.Device.Gpio)
      - /dev/gpiochip0:/dev/gpiochip0   # GPIO controller
      - /dev/spidev0.0:/dev/spidev0.0   # SPI bus 0, chip select 0 (APA102)
      - /dev/snd:/dev/snd               # ALSA sound devices (playback + capture)
    group_add:
      # GIDs must match the host's Raspberry Pi OS groups.
      # Verify on the speaker host with: getent group audio gpio spi
      - "${AUDIO_GID:-29}"   # audio
      - "${GPIO_GID:-997}"   # gpio
      - "${SPI_GID:-999}"    # spi
    volumes:
      # Override ALSA config with numeric card indices (card names need /proc/asound
      # which is unavailable in containers; numeric hw:N,0 refs work without it).
      - ./asound.conf:/etc/asound.conf:ro
    # Uncomment the line below as a last resort if hardware access still fails:
    # privileged: true
    labels:
      - "autoheal=true"
    healthcheck:
      # Plain TCP+HTTP probe via bash (no curl/wget in the aspnet base image).
      # Same silent-hang risk as the pi RabbitMQ-backed services: see
      # docs/deployment.md → Troubleshooting → "No speech output on any/all speakers".
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET / HTTP/1.0\r\n\r\n' >&3 && head -1 <&3 | grep -qE 'HTTP/1\\.[01] [0-9]{3}'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # ─── Autoheal ───────────────────────────────────────────────────────
  # Docker's healthcheck only marks a container "unhealthy" — it does NOT
  # restart it on its own. autoheal watches containers labeled
  # "autoheal=true" and force-restarts any that go unhealthy.
  autoheal:
    image: willfarrell/autoheal:latest
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
