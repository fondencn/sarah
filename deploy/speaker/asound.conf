# ALSA configuration for SpeechServer Docker container
#
# Uses numeric card indices so ALSA does not need /proc/asound for card
# name resolution (which is unavailable inside a Docker container).
#
# Expected card layout on Raspberry Pi with seeed-4mic-voicecard hat:
#   card 0: bcm2835 Headphones   — playback (3.5mm jack)
#   card 2: seeed-4mic-voicecard — capture  (ReSpeaker mic array)
#
# Verify on the host with: aplay -l && arecord -l

defaults.pcm.rate_converter "samplerate"

pcm.!default {
    type asym
    playback.pcm "playback"
    capture.pcm  "ac108"
}

pcm.playback {
    type plug
    slave.pcm "hw:0,0"
}

pcm.ac108 {
    type plug
    slave.pcm "hw:2,0"
}

ctl.!default {
    type hw
    card 0
}
