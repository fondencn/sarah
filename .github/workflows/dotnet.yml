# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal

  integration-tests:

    runs-on: ubuntu-latest
    
    # Integration tests need Docker to run Aspire services
    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Setup Docker
      uses: docker/setup-buildx-action@v3
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Run Aspire Integration Tests
      run: dotnet test tests/Sarah.AppHost.Tests/Sarah.AppHost.Tests.csproj --no-build --verbosity normal --logger "console;verbosity=detailed"
      timeout-minutes: 10
      env:
        ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
